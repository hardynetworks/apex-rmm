name: Tidy go.sum

# Run manually (Actions → Tidy go.sum → Run workflow) after changing
# dependencies: regenerates go.mod/go.sum and commits them if they changed.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: go mod tidy
        run: |
          go mod tidy
          go mod verify
          git diff --stat
      - name: Commit if changed
        run: |
          if git diff --quiet -- go.mod go.sum; then
            echo "go.mod and go.sum are already tidy"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "Tidy go.mod / go.sum"
          git push
