# Apex RMM stack
#
#   docker compose up -d --build
#
# Then open http://<server>:8080 and follow the setup wizard. Everything else
# (public URL, Authentik SSO, RustDesk) is configured in Settings.
#
# A .env file is optional: any variable from .env.example set there overrides
# the dashboard setting and locks that field.
# Add "--profile caddy" to also run Caddy with automatic HTTPS, and
# "--profile matter" to run the Matter controller for Matter smart plugs (docs/MATTER.md).

name: apex-rmm

services:
  # Generates the database password and encryption key once (stored in the "secrets" volume).
  init:
    image: alpine:3.20
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        for f in db_password app_key; do
          if [ ! -s /secrets/$$f ]; then
            head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 40 > /secrets/$$f
            echo "generated $$f"
          fi
        done
        chmod 644 /secrets/db_password /secrets/app_key
    volumes:
      - secrets:/secrets

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: apex
      POSTGRES_DB: apex
      POSTGRES_PASSWORD_FILE: /secrets/db_password
    volumes:
      - db:/var/lib/postgresql/data
      - secrets:/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex -d apex"]
      interval: 5s
      timeout: 5s
      retries: 20

  apex:
    build: .
    image: apex-rmm:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db
      DB_PASSWORD_FILE: /secrets/db_password
      APP_KEY_FILE: /secrets/app_key
      RUSTDESK_KEY_FILE: /rustdesk/id_ed25519.pub
    ports:
      - "${APEX_BIND:-8080}:8080"
    volumes:
      - secrets:/secrets:ro
      - rustdesk:/rustdesk:ro
    extra_hosts:
      # lets Apex reach services on the host, such as the Matter server
      - "host.docker.internal:host-gateway"

  # ---- RustDesk self-hosted server (backup remote access) ----
  hbbs:
    image: rustdesk/rustdesk-server:latest
    restart: unless-stopped
    command: hbbs
    volumes:
      - rustdesk:/root
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    depends_on:
      - hbbr

  hbbr:
    image: rustdesk/rustdesk-server:latest
    restart: unless-stopped
    command: hbbr
    volumes:
      - rustdesk:/root
    ports:
      - "21117:21117"
      - "21119:21119"

  # ---- optional Matter controller for Matter smart plugs ----
  # docker compose --profile matter up -d   (then Settings → Smart plugs in Apex)
  # Matter needs the host's network for mDNS discovery. It listens only on the Docker host
  # gateway (Apex reaches it as host.docker.internal), not on your LAN; set MATTER_LISTEN in
  # .env if your docker0 bridge isn't 172.17.0.1.
  matter:
    image: ghcr.io/matter-js/matterjs-server:stable
    profiles: ["matter"]
    restart: unless-stopped
    network_mode: host
    environment:
      LISTEN_ADDRESS: ${MATTER_LISTEN:-172.17.0.1}
    volumes:
      - matter:/data

  # ---- optional reverse proxy with automatic Let's Encrypt ----
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APEX_DOMAIN: ${APEX_DOMAIN:-rmm.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - apex

volumes:
  db:
  secrets:
  rustdesk:
  caddy:
  matter:
