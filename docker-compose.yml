# Hardy RMM stack
#
#   docker compose up -d --build
#
# Then open http://<server>:8080 and follow the setup wizard. Everything else
# (public URL, Authentik SSO, RustDesk) is configured in Settings.
#
# A .env file is optional: any variable from .env.example set there overrides
# the dashboard setting and locks that field.
# Add "--profile caddy" to also run Caddy with automatic HTTPS.

services:
  # Generates the database password and encryption key once (stored in the "secrets" volume).
  init:
    image: alpine:3.20
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        for f in db_password app_key; do
          if [ ! -s /secrets/$$f ]; then
            head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 40 > /secrets/$$f
            echo "generated $$f"
          fi
        done
        chmod 644 /secrets/db_password /secrets/app_key
    volumes:
      - secrets:/secrets

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: hardy
      POSTGRES_DB: hardy
      POSTGRES_PASSWORD_FILE: /secrets/db_password
    volumes:
      - db:/var/lib/postgresql/data
      - secrets:/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hardy -d hardy"]
      interval: 5s
      timeout: 5s
      retries: 20

  hardy:
    build: .
    image: hardy-rmm:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db
      DB_PASSWORD_FILE: /secrets/db_password
      APP_KEY_FILE: /secrets/app_key
      RUSTDESK_KEY_FILE: /rustdesk/id_ed25519.pub
    ports:
      - "${HARDY_BIND:-8080}:8080"
    volumes:
      - secrets:/secrets:ro
      - rustdesk:/rustdesk:ro

  # ---- RustDesk self-hosted server (backup remote access) ----
  hbbs:
    image: rustdesk/rustdesk-server:latest
    restart: unless-stopped
    command: hbbs
    volumes:
      - rustdesk:/root
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    depends_on:
      - hbbr

  hbbr:
    image: rustdesk/rustdesk-server:latest
    restart: unless-stopped
    command: hbbr
    volumes:
      - rustdesk:/root
    ports:
      - "21117:21117"
      - "21119:21119"

  # ---- optional reverse proxy with automatic Let's Encrypt ----
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      HARDY_DOMAIN: ${HARDY_DOMAIN:-rmm.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - hardy

volumes:
  db:
  secrets:
  rustdesk:
  caddy:
